x-api: &api
  image: organizae-api:local
  build:
    context: ./apps/api
  env_file:
    - .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:?Defina DB_NAME no .env}
    DB_USER: ${DB_USER:?Defina DB_USER no .env}
    DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no .env}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./apps/site
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4321}:4321"

volumes:
  postgres_data:
